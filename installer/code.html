<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WEEHS Installer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        color: #1c1917;
        background: linear-gradient(160deg, #f6ecd9, #efe2c8);
      }
      main {
        background: #fffaf2;
        border-radius: 18px;
        padding: 2rem 2.25rem;
        max-width: 32rem;
        box-shadow: 0 10px 30px rgba(60, 40, 10, 0.08);
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      .code {
        font:
          700 2.4rem/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        color: #2f6f62;
        margin: 1rem 0;
      }
      .muted {
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WEEHS Installer is running on this server</h1>
      <p>
        On any computer, open your company’s address for WEEHS, for example
        <b>http://ehs.yourcompany.com</b>, and enter this installer code:
      </p>
      <p class="code">__CODE__</p>
      <p class="muted">
        The address must already point at this server (a DNS record). Keep this server on until the
        installation has finished.
      </p>
    </main>
  </body>
</html>
