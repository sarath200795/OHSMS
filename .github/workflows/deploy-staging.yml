# Staging: every merge to main lands here first, so the first time a change
# meets a real Firebase project is not the time a customer meets it.
#
# Production (deploy.yml) is unchanged and still ships on a version tag. The
# relationship is: merge → staging automatically, tag → production deliberately.
#
# ── Why every variable here is prefixed STAGING_ ────────────────────────────
#
# The obvious design is a GitHub Environment named `staging` overriding the same
# VITE_* names production already uses. It is tidier, and it has one failure
# mode that rules it out: repository variables are the FALLBACK for anything an
# environment does not define. So a half-configured environment — one missing
# key, one typo in a name — resolves silently to the PRODUCTION values, and this
# workflow, which runs on every merge to main, deploys straight over production.
#
# Distinct names cannot do that. An unset STAGING_ variable is empty, not
# production, and the guard below turns empty into a stopped run. The names are
# uglier; the failure mode is "nothing happened" instead of "we overwrote
# production from a merge commit".
name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two merges race each other into the same project. Unlike the
# production deploy, cancelling a superseded staging run is fine — the next one
# ships a strictly newer commit.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

# Same least-privilege as ci.yml / deploy.yml. This job deploys to staging; it
# does not need to write back to the repository.
permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Skip politely until staging exists, exactly as deploy.yml does, so CI
      # stays green for forks and for the period before the project is created.
      - name: Check credentials are configured
        id: creds
        env:
          SA: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_FIREBASE_SERVICE_ACCOUNT not set — skipping staging deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # ── The guard that makes this workflow safe to run on every merge ──────
      #
      # Three ways this could point at production, all of them checked, because
      # this runs unattended and the damage is not recoverable by re-running:
      #
      #   1. the staging project id was never set          → empty
      #   2. someone pasted the production id into it      → equal
      #   3. the service account belongs to production      → cannot be checked
      #      here, which is why step 4 re-reads the project from the deploy
      #      itself rather than trusting this variable alone
      #
      # A mismatch is a HARD FAILURE, not a skip. A skip would be indistinguishable
      # from "staging is not set up yet" and this is the opposite: it is set up
      # wrong, and someone has to look.
      - name: Refuse to deploy if this is not a distinct project
        if: steps.creds.outputs.configured == 'true'
        env:
          STAGING_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          PROD_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$STAGING_ID" ]; then
            echo "::error::STAGING_FIREBASE_PROJECT_ID is not set. Refusing to deploy."
            exit 1
          fi
          if [ "$STAGING_ID" = "$PROD_ID" ]; then
            echo "::error::STAGING_FIREBASE_PROJECT_ID equals the production project ($PROD_ID). Refusing."
            exit 1
          fi
          echo "Staging target: $STAGING_ID (production is $PROD_ID)"

      - name: Write the service-account key
        if: steps.creds.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa-staging.json"
          chmod 600 "$RUNNER_TEMP/sa-staging.json"

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      # The Firestore emulator is a Java process. Production's deploy.yml already
      # installs a JDK and runs the rules suite before it ships firestore.rules
      # — this workflow deploys the same ruleset and previously skipped both.
      # A merge to main is how a rules regression would first meet a real
      # project; catching it here is cheaper than catching it on a tag.
      - uses: actions/setup-java@v5
        if: steps.creds.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: 17

      # The same gates production runs. Staging is where a bad change is
      # supposed to be caught, which it cannot be if it was never checked.
      - name: Lint and test
        if: steps.creds.outputs.configured == 'true'
        run: |
          npx eslint src
          npx vitest run
          npm --prefix functions ci
          npm --prefix functions test

      - name: Rules tests
        if: steps.creds.outputs.configured == 'true'
        run: npm run test:rules

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.STAGING_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.STAGING_APPCHECK_SITE_KEY }}
          # Same silent-drop as production's build step: not named here means
          # not in the bundle, and the emergency-services lookup degrades
          # quietly rather than failing loudly.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.STAGING_GOOGLE_MAPS_API_KEY }}
          # Deliberately its own DSN, and fine to leave unset. Sentry tags an
          # event with import.meta.env.MODE, which is "production" for any
          # `vite build` — so pointing staging at the production DSN files
          # staging noise in the production inbox under the production label,
          # and the first thing it costs you is trust in the alerts.
          VITE_SENTRY_DSN: ${{ vars.STAGING_SENTRY_DSN }}
          VITE_ENCRYPTION: ${{ vars.STAGING_ENCRYPTION }}
        run: npm run build

      # Same order as production, for the same reasons (PRODUCTION.md 0b):
      # functions before rules, because rules depend on claims and on the
      # deleteOrgFile callable; rules and indexes before hosting, because the
      # client depends on both.
      #
      # This step is the one that has been red since 2026-08-29:
      # iam.serviceAccounts.actAs on the staging runtime SA (DEPLOYMENT.md §5).
      # The JSON key in STAGING_FIREBASE_SERVICE_ACCOUNT cannot grant that to
      # itself. Failure here is that IAM gap, not a missing retry.
      #
      # Same non-interactive params failure as production (deploy.yml):
      # firebase-tools ignores defineString defaults unless
      # functions/.env.<projectId> exists, and a secret named in that error
      # is not the same thing as a secret missing from Secret Manager.
      # Secrets are not written into the dotenv file (LOW-13).
      - name: Write functions param file
        if: steps.creds.outputs.configured == 'true'
        env:
          PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: bash scripts/prepare-functions-deploy.sh write-env

      # Same secret rules as production. Leave an existing secret alone.
      # Create SMTP_PASS only when it is missing (GitHub secret SMTP_PASS, or
      # the non-sending placeholder UNSET-PLACEHOLDER). If DATA_KEY_MASTER is
      # missing, fail — do not invent a master key. A missing secret is not
      # the iam.serviceAccounts.actAs gap above.
      - name: Ensure functions secrets
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-staging.json
          PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: bash scripts/prepare-functions-deploy.sh ensure-secrets

      # Params and secrets are prepared above. A placeholder SMTP_PASS deploys
      # and does not send (DEPLOYMENT.md §6).
      - name: Deploy functions
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-staging.json
        run: |
          if ! npx firebase-tools deploy --only functions \
            --project "${{ vars.STAGING_FIREBASE_PROJECT_ID }}" --non-interactive --force; then
            echo "::error::Functions deploy failed. If the log names iam.serviceAccounts.actAs, the staging deployer cannot impersonate the runtime SA — grant that in GCP, or stop deploying functions from CI until then (DEPLOYMENT.md §5). This job did not change IAM."
            exit 1
          fi

      - name: Deploy rules + indexes
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-staging.json
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage \
            --project "${{ vars.STAGING_FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-staging.json
        run: |
          npx firebase-tools deploy --only hosting \
            --project "${{ vars.STAGING_FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Where it went
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "::notice::Staging updated: https://${{ vars.STAGING_FIREBASE_PROJECT_ID }}.web.app"

      - name: Remove the service-account key
        if: always() && steps.creds.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/sa-staging.json"
