<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- WEHS brand mark — kraft-paper tile with flat pastel safety icons -->
  <defs>
    <linearGradient id="kraft" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d2a47e"/>
      <stop offset="0.55" stop-color="#c6946c"/>
      <stop offset="1" stop-color="#b98860"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#kraft)"/>
  <!-- soft crumple highlights -->
  <polygon points="40,120 210,60 150,200" fill="#e4bd97" opacity="0.25"/>
  <polygon points="470,300 360,420 480,440" fill="#a97e55" opacity="0.18"/>
  <polygon points="90,430 220,360 260,470" fill="#e4bd97" opacity="0.16"/>

  <!-- ── Siren (top-left) ── -->
  <g>
    <g stroke="#e8a33d" stroke-width="9" stroke-linecap="round">
      <line x1="122" y1="52" x2="122" y2="76"/>
      <line x1="74" y1="70" x2="90" y2="90"/>
      <line x1="170" y1="70" x2="154" y2="90"/>
      <line x1="52" y1="112" x2="76" y2="120"/>
      <line x1="192" y1="112" x2="168" y2="120"/>
    </g>
    <path d="M92 140v-8c0-20 13-34 30-34s30 14 30 34v8z" fill="#d94a3c"/>
    <path d="M104 106c3-4 8-7 13-8" stroke="#f0897d" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="80" y="140" width="84" height="16" rx="8" fill="#8d99a5"/>
  </g>

  <!-- ── W E (top row) — E is the shared crossword letter: it completes "WE"
       across the top AND heads the "E H S" column down the right side, so E, H
       and S sit on one common centre line (x=428) and W shares E's baseline. ── -->
  <text x="298" y="142" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#f7f3ec" stroke="#8a6844" stroke-width="2">W</text>
  <text x="428" y="142" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#f7f3ec" stroke="#8a6844" stroke-width="2">E</text>

  <!-- ── Hands holding leaves (mid-left) ── -->
  <g>
    <g fill="#8fbc74">
      <ellipse cx="96" cy="216" rx="13" ry="20" transform="rotate(-28 96 216)"/>
      <ellipse cx="128" cy="216" rx="13" ry="20" transform="rotate(28 128 216)"/>
      <ellipse cx="112" cy="202" rx="11" ry="18"/>
    </g>
    <path d="M46 268c-6 22 2 36 20 40 16 4 34-2 46-14V252c-10-10-26-12-36-4-16-8-26 6-30 20z" fill="#7fc4bb"/>
    <path d="M178 268c6 22-2 36-20 40-16 4-34-2-46-14V252c10-10 26-12 36-4 16-8 26 6 30 20z" fill="#6db3aa"/>
  </g>

  <!-- ── Hi-vis vest (mid-center) ── -->
  <g>
    <path d="M222 200l26 2a18 12 0 0 0 32 0l26-2 12 26-10 8v76h-88v-76l-10-8z" fill="#f0a231"/>
    <path d="M248 202a18 12 0 0 0 32 0l-4 30h-24z" fill="#d98a1f"/>
    <rect x="222" y="272" width="88" height="11" fill="#f6e3bb"/>
    <rect x="222" y="288" width="88" height="11" fill="#e8b93d"/>
    <line x1="266" y1="234" x2="266" y2="310" stroke="#c77f18" stroke-width="4"/>
  </g>

  <!-- ── H (mid-right, dark — same column as E and S) ── -->
  <text x="428" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#26211a">H</text>

  <!-- ── Heart with pulse (bottom-left) ── -->
  <g>
    <path d="M112 462c-34-28-48-47-48-67a24 24 0 0 1 48-6 24 24 0 0 1 48 6c0 20-14 39-48 67z" fill="#e8877c"/>
    <polyline points="76,404 96,404 104,390 116,420 126,398 132,404 148,404" fill="none" stroke="#faf3ea" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── First-aid kit (bottom-center) ── -->
  <g>
    <path d="M246 384v-8a20 14 0 0 1 40 0v8" fill="none" stroke="#7189a0" stroke-width="9"/>
    <rect x="214" y="382" width="104" height="80" rx="14" fill="#8ba7bd"/>
    <rect x="258" y="396" width="16" height="52" rx="4" fill="#f4f1ea"/>
    <rect x="240" y="414" width="52" height="16" rx="4" fill="#f4f1ea"/>
  </g>

  <!-- ── S (bottom-right, dark — same column as E and H) ── -->
  <text x="428" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#26211a">S</text>
</svg>
