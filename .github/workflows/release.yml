# Publishes a self-hostable release on every version tag: the dedicated-
# environment image (stack/Dockerfile) to GitHub Container Registry, and a
# GitHub release page that says what it is, how to upgrade, and how to check
# that what a company downloaded is what was published. docs/RELEASES.md.
#
# deploy.yml ships the shared Firebase site on the same tags and is
# unaffected. android-apk.yml also writes to the release; whichever of the two
# runs first creates it, and the other adds to it.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# contents:write creates the release and uploads its files; packages:write
# pushes the image. Nothing here pushes commits.
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the tag must be shown to be on main (below).
          fetch-depth: 0

      # A tag can point at any commit, including one that never entered main
      # or ran CI (deploy.yml explains this for production). A release is
      # something companies install on their own servers, so it is refused
      # from anything main does not contain.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Not releasing it."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The same gate CI runs, on the exact commit being released.
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Names
        id: names
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # It becomes an image tag and file names: a version, nothing else.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/weehs-dedicated" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        id: image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.names.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f stack/Dockerfile \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

      # The source exactly as tagged, with its checksum. GitHub's automatic
      # archives are not guaranteed byte-stable, so a checksum of those would
      # not hold.
      - name: Source archive and checksums
        env:
          VERSION: ${{ steps.names.outputs.version }}
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p out
          git archive --format=tar.gz --prefix="weehs-$VERSION/" -o "out/weehs-$VERSION-source.tar.gz" "$GITHUB_SHA"
          # Just the self-hosting kit (docs/SELF-HOSTING.md): what an
          # organization copies onto its server.
          git archive --format=tar.gz --prefix="weehs-selfhost-$VERSION/" -o "out/weehs-$VERSION-selfhost.tar.gz" "$GITHUB_SHA" selfhost
          printf '{"version":"%s","tag":"%s","commit":"%s","image":"%s:%s","digest":"%s"}\n' \
            "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$IMAGE" "$VERSION" "$DIGEST" > out/release.json
          (cd out && sha256sum "weehs-$VERSION-source.tar.gz" "weehs-$VERSION-selfhost.tar.gz" release.json > SHA256SUMS)

      - name: Release notes
        env:
          VERSION: ${{ steps.names.outputs.version }}
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Install or upgrade"
            echo
            echo "Image, pinned to this release by digest (prefer this to the tag):"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Tag: \`$IMAGE:$VERSION\` · Commit: \`$GITHUB_SHA\`"
            echo
            echo "Upgrade: deploy this image in place of the previous one with the same"
            echo "environment and secrets. The database schema is updated when the new"
            echo "version starts. Keep \`STATE_KEY\` and \`SESSION_SECRET\` unchanged. Full"
            echo "steps: [docs/RELEASES.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/RELEASES.md)."
            echo
            echo "Self-hosting on your own server: \`weehs-$VERSION-selfhost.tar.gz\` below,"
            echo "with [docs/SELF-HOSTING.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/SELF-HOSTING.md)."
            echo
            echo "Check a download: \`sha256sum -c SHA256SUMS\` next to the files below."
            echo
            echo "The Android APK for the shared site's download page is attached when its"
            echo "build finishes."
            echo
          } > notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          FILES=(out/weehs-$VERSION-source.tar.gz out/weehs-$VERSION-selfhost.tar.gz out/release.json out/SHA256SUMS)
          # Create, or — when android-apk.yml created it first, even a moment
          # ago — keep its file, replace its notes, and add ours.
          if ! gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes "${FILES[@]}"; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          fi
