# Runs the checks that were being run by hand on every change: lint, unit
# tests, the Firestore rules suite, and a production build.
#
# The rules job is separate because it needs a JDK — the Firestore emulator is
# a Java process — and there is no reason to make the fast checks wait for one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dependency advisories ───────────────────────────────────────────────────
  # Nothing scanned the tree, so every advisory in it was invisible: an ISO
  # 27001 audit found 2 critical and 9 high sitting there unnoticed, and the
  # only reason none of them mattered much is luck — almost all were in
  # devDependencies, which never reach a user.
  #
  # That distinction is the whole design of this job. `--omit=dev` scans what
  # ACTUALLY SHIPS. A critical in vitest is a fact about this repository's
  # toolchain; a high in a runtime dependency is a fact about the deployed
  # product, and only the second should stop a merge. Failing on the first
  # would train everyone to ignore a red build, which is how the real one gets
  # missed.
  #
  # The dev tree is still reported, as a warning that never blocks, so it does
  # not become invisible again.
  #
  # Blocking at HIGH via scripts/audit-gate.mjs, which allows a NAMED list of
  # advisories rather than lowering the threshold. The first version blocked at
  # critical only, because one unfixable high (xlsx) would have made the gate red
  # on the day it shipped — but that hid every other high too, which is most of
  # what a dependency gate is for. The allowlist entry has to say why it is
  # tolerable and what closes it, and a stale entry is reported. If the list
  # grows, that is the signal, not the workaround.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Runtime dependencies (blocking)
        run: node scripts/audit-gate.mjs

      - name: Cloud Functions (blocking)
        working-directory: functions
        # No allowlist here — the functions tree is clean at high, and it should
        # stay that way. If this ever goes red, fix it rather than exempting it.
        run: npm ci && npm audit --omit=dev --audit-level=high

      # Same reasoning as the moderate report in scripts/audit-gate.mjs: "does
      # not block" was being implemented as "is not mentioned", and those are
      # different things. The step above passes while the tree holds 8 moderate
      # advisories that nothing has ever printed. Never fails.
      - name: Cloud Functions, moderate and below (advisory only)
        if: always()
        working-directory: functions
        run: npm audit --omit=dev || true

      - name: Whole tree, including tooling (advisory only)
        if: always()
        run: npm audit || true

  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci needs the lockfile to match package.json, which is what we want
      # CI to enforce — it fails loudly rather than quietly resolving something
      # different from what anyone has installed locally.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The `npm test` above cannot reach this suite: vitest.config.js includes only
  # src/**, and functions/ has its own config, its own lockfile and its own
  # dependency tree. So the notification tier's tests ran in exactly one place —
  # deploy.yml, on a version tag — which means a merge could break the triggers
  # and the digest and nothing said so until someone cut a release. Same two
  # commands deploy.yml runs, moved to where they can still stop a merge.
  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        working-directory: functions
        run: npm ci

      - name: Unit tests
        working-directory: functions
        run: npm test

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator runs on the JVM; without this the suite fails
      # with an error about Java that says nothing about the rules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # /reports accepts unauthenticated writes by design, so these tests are
      # the check on how far that permission actually reaches.
      - name: Rules tests
        run: npm run test:rules

  e2e:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The auth + Firestore emulators back the whole flow; both run on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Emulators up → seed the demo org → drive the browser through the money
      # flows. Playwright's webServer starts the Vite dev server itself.
      #
      # e2e/accessibility.spec.js runs in the same pass, and it is here rather
      # than beside the lint job for a reason: it is the half of the
      # accessibility gate that eslint structurally cannot be. The dominant form
      # control in this app is `<Field label=…><input/></Field>`, where the label
      # is bound to the control at RUNTIME, so whether the binding happened is
      # invisible to a static rule and plain to axe. Static lint for what is
      # statically visible; axe, against the rendered DOM, for the rest.
      - name: Smoke tests
        env:
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_PROJECT_ID: ohsms-demo
          # Not a credential — the Auth emulator accepts any key and validates
          # none. It has to be PRESENT though: with it absent the Firebase app
          # never initialises, so every flow fails at whatever it touched first
          # and the run reads as four broken features rather than one missing
          # variable. Locally .env supplies this, which is why the suite passed
          # on a laptop and had never once been green here.
          #
          # isFirebaseConfigured only requires a projectId under emulators
          # (src/shared/firebase.js), so nothing warns that this is missing.
          VITE_FIREBASE_API_KEY: demo-api-key
        run: >
          npx firebase-tools emulators:exec --only auth,firestore
          --project ohsms-demo
          "node scripts/seed.mjs && npx playwright test"
