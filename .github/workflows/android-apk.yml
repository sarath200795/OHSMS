# Builds the Android package the login page links to.
#
# Debug-signed when the release keystore secrets are absent, so a fork and a
# repo that has not created an upload key still produce a file a phone can
# install. Release-signed when all four ANDROID_KEYSTORE_* secrets are set.
# The two signatures do not install over each other.
#
# This does not deploy hosting. The APK is an Actions artifact, and on a
# version tag it is also attached to that GitHub release. Deploy downloads it
# into public/downloads before the hosting build. See docs/MOBILE.md.
#
# Not part of the pull-request checks. An Android SDK build is slow, and a
# missing keystore must not turn a web change red.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# contents:write is for attaching the APK to a tag release. The job does not
# push commits. Artifact upload uses the same token.
permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      # Same variables as the hosting build. Absent, the bundle still builds;
      # it then has no Firebase project, which is a file that installs and
      # cannot sign in. Set the repository variables before shipping an APK
      # people will use.
      - name: Build the web app
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_ENCRYPTION: ${{ vars.VITE_ENCRYPTION }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
          VITE_TESTFLIGHT_URL: ${{ vars.VITE_TESTFLIGHT_URL }}
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      # The keystore never lands in the log or the repo. A partial set of
      # secrets is treated as "no keystore": a half-configured release sign
      # fails the build in a way that looks like a Gradle bug.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/upload.jks
            cat > android/keystore.properties <<EOF
          storeFile=upload.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect weehs-ohsms.apk
        env:
          SIGNING: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$SIGNING" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$SRC"
          mkdir -p dist-apk
          cp "$SRC" dist-apk/weehs-ohsms.apk
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          printf '%s\n' "{\"version\":\"${VERSION}\",\"versionCode\":${CODE},\"url\":\"/downloads/weehs-ohsms.apk\",\"signing\":\"${SIGNING}\"}" > dist-apk/weehs-ohsms.json

      - uses: actions/upload-artifact@v4
        with:
          name: weehs-ohsms-apk
          path: |
            dist-apk/weehs-ohsms.apk
            dist-apk/weehs-ohsms.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to the version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes "Android APK for the login-page download. Copy weehs-ohsms.apk and weehs-ohsms.json into public/downloads and redeploy hosting. See docs/MOBILE.md."
          dist-apk/weehs-ohsms.apk
          dist-apk/weehs-ohsms.json
          || gh release upload "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --clobber
          dist-apk/weehs-ohsms.apk
          dist-apk/weehs-ohsms.json
