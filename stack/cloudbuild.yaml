# Build the dedicated-environment image on Cloud Build. One image serves
# every company (docs/CONTROL-PLANE.md, step 4). From the repository root:
#
#   gcloud builds submit --config stack/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/weehs-dedicated:TAG .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'stack/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - ${_IMAGE}
