# Deploys happen from CI, not from a laptop: the artifact that went through
# lint, tests and rules checks is the artifact that ships, and every release is
# traceable to a commit.
#
# Setup (once):
#   1. Firebase console → Project settings → Service accounts → generate key.
#   2. GitHub repo → Settings → Secrets → Actions → new secret
#      FIREBASE_SERVICE_ACCOUNT with the JSON as its value.
#   3. Copy .env.production values into repo Variables (VITE_* below).
# Until the secret exists, this workflow skips rather than fails, so CI stays
# green for forks and for the period before production credentials are set up.
name: Deploy

on:
  push:
    tags: ['v*']          # releases deploy on tags: v1.0.0, v1.1.0, …
  workflow_dispatch: {}    # and manually from the Actions tab when needed

concurrency:
  group: deploy
  cancel-in-progress: false   # never cancel a half-finished release

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials are configured
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set — skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator is a Java process, and the rules suite below
      # cannot run without it.
      - uses: actions/setup-java@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      # The same gates CI runs on push — a tag must not be able to skip them.
      - name: Lint and test
        if: steps.creds.outputs.configured == 'true'
        run: |
          npx eslint src
          npx vitest run
          npm --prefix functions ci
          npm --prefix functions test

      # The rules suite, which this step claimed to cover and did not.
      #
      # This job deploys firestore.rules and storage.rules — the only
      # enforcement boundary this app has — and it re-runs the other gates
      # precisely so a tag cannot ship past them. It ran the unit tests and
      # skipped the 422 tests that exercise the thing being deployed.
      #
      # CI covers this on pushes to main, which is why it was easy to miss. But
      # a tag is not a push: it can point at any commit, including one whose
      # rules job never ran or ran red. The artifact that ships must be the one
      # that passed, and for a ruleset that means these tests.
      - name: Rules tests
        if: steps.creds.outputs.configured == 'true'
        run: npm run test:rules

      # The browser gate, and the one this job was missing.
      #
      # A tag deployed straight past Playwright, so the only tests that open the
      # PUBLIC surfaces — the permit a stranger scans at a barrier, the
      # equipment QR — never ran before a release. That is not hypothetical: a
      # seeded fixture contradicted itself for four days, the two permit tests
      # failed on every push to main, and three tagged releases shipped green
      # over the top of it because this job could not see them.
      #
      # The trade-off is real and deliberate. A browser test can now block a
      # release, and browser tests fail for reasons that have nothing to do with
      # the change — a slow runner, a cold dev server. Retries are already
      # configured for CI (playwright.config.js sets retries: 1 when CI is set),
      # which absorbs the genuinely transient ones. What it does not absorb is a
      # test that is actually red, and stopping there is the point: these cover
      # a page somebody reads to decide whether it is safe to start work.
      #
      # Placed BEFORE the build and every deploy step, so a failure costs a
      # cancelled release rather than a half-deployed one.
      - name: Install Chromium
        if: steps.creds.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        if: steps.creds.outputs.configured == 'true'
        env:
          # Emulator config, scoped to THIS step. It must not reach the build
          # below, which takes its VITE_* values from repository variables and
          # would otherwise ship a production bundle pointed at an emulator that
          # only ever existed on the runner.
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_PROJECT_ID: ohsms-demo
          # Not a credential — the Auth emulator accepts any key and validates
          # none. Present because the Firebase app does not initialise without
          # one, and every flow would then fail at whatever it touched first.
          VITE_FIREBASE_API_KEY: demo-api-key
        run: >
          npx firebase-tools emulators:exec --only auth,firestore
          --project ohsms-demo
          "node scripts/seed.mjs && npx playwright test"

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          # Where every uploaded file lives. Missing here until now, while
          # deploy-staging.yml passed it — so a CI-built production bundle
          # initialised Firebase with no bucket and every upload and download
          # failed. .env.production carries it and warns in its own comment that
          # this is how production once shipped pointing at the emulator bucket;
          # that file is gitignored, so CI has never seen it.
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # The nearest-emergency-services lookup. Absent it resolves to '' and
          # the feature degrades rather than crashing, which is why nothing has
          # ever reported it — the same silent-drop as the bucket above.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          # Whether the shipped bundle SEALS what it writes. Absent here it
          # resolves to '' — which is 'off' — so a value set only in a local
          # .env.production would build a bundle that quietly stores every
          # incident narrative, meeting minute and injury record in plaintext
          # while the operator believed encryption was live. That is the exact
          # shape of audit finding LOW-12: anything the local file defines and
          # this step does not name is silently dropped. That comment was
          # written here and then only this one variable was added, which is how
          # the bucket above stayed missing. Decryption is unaffected either
          # way, so a bundle built
          # without it still reads everything already sealed.
          VITE_ENCRYPTION: ${{ vars.VITE_ENCRYPTION }}
        run: npm run build

      # Functions FIRST, and they were previously deployed by nothing at all —
      # every version in production got there from a laptop, with no link to a
      # commit. syncUserClaims is the one that makes the ordering matter: it
      # mints the orgId/role claim that storage.rules enforces on, so rules that
      # depend on a claim must never ship before the function that sets it.
      #
      # --force because a scheduled function that has been renamed or removed
      # otherwise prompts, and a non-interactive run would hang until it timed
      # out. Nothing here deletes data; the worst case is a stale function going.
      - name: Deploy functions
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only functions \
            --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive --force

      # Two steps, in this order, deliberately — see docs/PRODUCTION.md §0b.
      #
      # Rules and indexes go first because the bundle depends on both: a client
      # that ships before its rules gets PERMISSION_DENIED, and one that ships
      # before its indexes gets FAILED_PRECONDITION on the first compound query.
      # Indexes were previously never deployed by CI at all, so every index the
      # app relied on existed only because someone had run a deploy from a
      # laptop — and a fresh project would have had none of them.
      #
      # Index builds are asynchronous: this returns once they are accepted, not
      # once they are ready, so a brand-new index can still be building when
      # hosting goes live. That window is minutes and only affects the query
      # that needs it; shipping the client first would break it for certain.
      - name: Deploy rules + indexes
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage \
            --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy hosting
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools deploy --only hosting \
            --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive
