# Runs the checks that were being run by hand on every change: lint, unit
# tests, the Firestore rules suite, and a production build.
#
# The rules job is separate because it needs a JDK — the Firestore emulator is
# a Java process — and there is no reason to make the fast checks wait for one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci needs the lockfile to match package.json, which is what we want
      # CI to enforce — it fails loudly rather than quietly resolving something
      # different from what anyone has installed locally.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator runs on the JVM; without this the suite fails
      # with an error about Java that says nothing about the rules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # /reports accepts unauthenticated writes by design, so these tests are
      # the check on how far that permission actually reaches.
      - name: Rules tests
        run: npm run test:rules

  e2e:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The auth + Firestore emulators back the whole flow; both run on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Emulators up → seed the demo org → drive the browser through the money
      # flows. Playwright's webServer starts the Vite dev server itself.
      - name: Smoke tests
        env:
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_PROJECT_ID: ohsms-demo
          # Not a credential — the Auth emulator accepts any key and validates
          # none. It has to be PRESENT though: with it absent the Firebase app
          # never initialises, so every flow fails at whatever it touched first
          # and the run reads as four broken features rather than one missing
          # variable. Locally .env supplies this, which is why the suite passed
          # on a laptop and had never once been green here.
          #
          # isFirebaseConfigured only requires a projectId under emulators
          # (src/shared/firebase.js), so nothing warns that this is missing.
          VITE_FIREBASE_API_KEY: demo-api-key
        run: >
          npx firebase-tools emulators:exec --only auth,firestore
          --project ohsms-demo
          "node scripts/seed.mjs && npx playwright test"
